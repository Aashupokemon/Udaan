<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UDAAN - Help that reaches you.</title>
  <meta name="theme-color" content="#06222c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/udaan-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/udaan-icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-wash" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <button class="icon-btn" id="home-btn" type="button" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M3.4 11 12 3.8 20.6 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.9 10.2v9.1h12.2v-9.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M10.2 19.3v-4.5h3.6v4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>

    <div class="menu">
      <button class="icon-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-panel" aria-haspopup="true" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
      <nav class="menu-panel" id="menu-panel" hidden aria-label="More pages"></nav>
    </div>

    <div class="brand">
      <span class="brand-chip">
        <img class="brand-logo" src="assets/udaan-mark.png" alt="UDAAN logo" width="672" height="410" decoding="async">
      </span>
      <span class="brand-name">UDAAN</span>
    </div>

    <div class="header-shell"></div>

    <nav class="site-nav" aria-label="Main">
      <a class="tab" href="#/emergency" data-tab="emergency">
        <span class="tab-icon tab-icon-alert" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="13" height="13"><path d="M8 2 15 14H1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.2v3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.9" r="0.85" fill="currentColor"/></svg>
        </span>
        <span data-tab-label>Emergency</span>
      </a>
      <a class="tab" href="#/aid" data-tab="aid">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="13" height="13"><path d="M6.3 2h3.4v4.3H14v3.4H9.7V14H6.3V9.7H2V6.3h4.3Z" fill="currentColor"/></svg>
        </span>
        <span data-tab-label>First aid</span>
      </a>
    </nav>


  </header>

  <main id="main" class="container" role="main"></main>

  <footer class="site-footer" id="site-footer">
    <p class="footer-note">Udaan app · demo build</p>
    <p class="disclaimer">UDAAN is not an emergency service. If someone is in immediate danger, call local emergency services (for example 112).</p>
  </footer>

  <audio id="bg-music" src="assets/udaan-music.mp3" loop preload="none"></audio>
  <div class="dock" role="group" aria-label="Display and sound">
    <button class="dock-btn" id="theme-btn" type="button" aria-pressed="false" title="Switch to light theme" aria-label="Switch to light theme">
      <span class="dock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 3.8a8.2 8.2 0 0 0 0 16.4Z" fill="currentColor" opacity="0.9"/>
        </svg>
      </span>
      <span class="dock-label">Light</span>
    </button>
    <button class="dock-btn" id="lang-toggle" type="button" aria-pressed="false" aria-label="Switch language">
      <span class="dock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.7 12h16.6M12 3.6c2.4 2.4 3.6 5.2 3.6 8.4S14.4 18 12 20.4M12 3.6C9.6 6 8.4 8.8 8.4 12s1.2 6 3.6 8.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </span>
      <span class="dock-label">हिंदी</span>
    </button>
    <button type="button" class="music-btn" id="music-btn" aria-pressed="false">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="music-label">Play music</span>
    </button>
  </div>

  <script type="application/json" id="app-state">{"locale":"en"}</script>
  <script type="module" src="app.js"></script>
</body>
</html>
